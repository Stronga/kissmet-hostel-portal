<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Kissmet Group — a thoughtfully designed student housing experience is on the way." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="robots" content="index,follow" />
  <title>Kissmet Group — Coming Soon</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="page">
    <header class="brand" aria-label="Kissmet Group">
      <div class="logo-plate">
        <picture>
          <source srcset="assets/logo.webp" type="image/webp" />
          <img
            class="logo"
            src="assets/logo.jpg"
            width="240"
            height="164"
            alt="Kissmet Group emblem — laurel wreath, Adinkra symbols, and the Black Star of Africa"
          />
        </picture>
      </div>
    </header>

    <main id="main" class="content">
      <p class="eyebrow">Kissmet Group</p>
      <h1>Something special is taking shape.</h1>
      <p class="lede">
        We’re preparing a calm, well-run home for students —
        rooted in Ghanaian hospitality, designed for everyday life.
      </p>
      <p class="support">
        Kissmet Hostel will open here soon. Thank you for your patience
        while we finish the details.
      </p>

      <figure class="hero">
        <picture>
          <source srcset="assets/hostel-sketch.webp" type="image/webp" />
          <img
            class="hero-image"
            src="assets/hostel-sketch.jpg"
            width="1400"
            height="787"
            alt="Architectural sketch of the Kissmet Hostel building facade with entrance portico and landscaped grounds"
            loading="eager"
            decoding="async"
          />
        </picture>
        <figcaption>Kissmet Hostel — coming soon</figcaption>
      </figure>
    </main>

    <footer class="footer">
      <div class="accent-bar" aria-hidden="true"></div>
      <p>&copy; 2026 Kissmet Group</p>
    </footer>
  </div>
</body>
</html>
