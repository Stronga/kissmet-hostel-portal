# Kissmet Hostel Portal API — Wrangler environments
#
# Environment separation (Phase 2):
#   local      — developer machine; mock SMS; local D1/R2
#   test       — CI / automated tests; mock SMS; isolated resource names
#   staging    — pre-prod; placeholders until real CF resources exist
#   production — live; workers_dev=false; HTTPS origins only; real secrets via `wrangler secret put`
#
# NEVER point production at local/test D1, R2, mock SMS, localhost CORS, or the WireGuard .5 connector.
# Production D1 (kissmet-production) and R2 (kissmet-documents-production) are wired below (PR #17).
# Staging D1 kissmet-hostel-staging (958f10b6-a7a6-4943-8c20-afe9b97e6388) and private R2
# kissmet-hostel-staging-documents were created 2026-11-23 after owner approval.
# Further staging deploys, secret changes, and Access/DNS still need care; production is separate.
# Migration 0022 is reserved for refund records and must not be used for staging schema.
#
# Secrets (never commit; never put in [vars]) — names only, run only with owner approval:
#   npx wrangler secret put STAGING_OTP_TEST_KEY --env staging   # staging OTP test path only
#   npx wrangler secret put ARKESEL_API_KEY --env production
#   npx wrangler secret put MIKROTIK_CONNECTOR_SECRET --env production
#   npx wrangler secret put MIKROTIK_CONNECTOR_URL --env production            # or a var once the Tunnel hostname is final
#   npx wrangler secret put MIKROTIK_CONNECTOR_ACCESS_CLIENT_ID --env production      # Cloudflare Access service token
#   npx wrangler secret put MIKROTIK_CONNECTOR_ACCESS_CLIENT_SECRET --env production
#   npx wrangler secret put CONNECTOR_HEARTBEAT_SECRET --env production        # Pi → Worker heartbeat HMAC (>=32 chars)
# Non-secret var after the Pi UUID is known: CONNECTOR_HEARTBEAT_ALLOWED_IDS = "<uuid>"
# See mikrotik-connector/deploy/CLOUDFLARE_TUNNEL_ACCESS.md and docs/CONNECTOR_HEARTBEAT.md.

name = "kissmet-hostel-api"
main = "src/index.ts"
compatibility_date = "2026-08-27"
workers_dev = true

[vars]
APP_NAME = "Kissmet Hostel Portal API"
APP_ENV = "local"
APP_VERSION = "0.1.0"
PUBLIC_BASE_URL = "http://localhost:8787"
ADMIN_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
SMS_PROVIDER = "mock"

[[d1_databases]]
binding = "DB"
database_name = "kissmet-hostel-local"
database_id = "local-kissmet-hostel-db"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kissmet-hostel-local-documents"

# --- local ---
[env.local]
name = "kissmet-hostel-api-local"
workers_dev = true

[env.local.vars]
APP_NAME = "Kissmet Hostel Portal API"
APP_ENV = "local"
APP_VERSION = "0.1.0"
PUBLIC_BASE_URL = "http://localhost:8787"
ADMIN_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
SMS_PROVIDER = "mock"

[[env.local.d1_databases]]
binding = "DB"
database_name = "kissmet-hostel-local"
database_id = "local-kissmet-hostel-db"
migrations_dir = "migrations"

[[env.local.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kissmet-hostel-local-documents"

# --- test (CI) ---
[env.test]
name = "kissmet-hostel-api-test"
workers_dev = true

[env.test.vars]
APP_NAME = "Kissmet Hostel Portal API"
APP_ENV = "local"
APP_VERSION = "0.1.0"
PUBLIC_BASE_URL = "http://localhost:8787"
ADMIN_ALLOWED_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
SMS_PROVIDER = "mock"

[[env.test.d1_databases]]
binding = "DB"
database_name = "kissmet-hostel-test"
database_id = "test-kissmet-hostel-db"
migrations_dir = "migrations"

[[env.test.r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "kissmet-hostel-test-documents"

# --- staging ---
# Isolated pre-prod. Do not create the D1 database or R2 bucket, apply remote migrations,
# set secrets, or deploy until the owner approves the exact commands in docs/STAGING_PLAN.md.
# Mock SMS only. No MIKROTIK_CONNECTOR_URL — staging never talks to the real MikroTik or Pi.
# Do not set DEV_OTP_LOG here (OTPs would land in Worker logs). Use the staging OTP test path
# (APP_ENV=staging + STAGING_OTP_TEST_KEY secret), behind Cloudflare Access.
[env.staging]
name = "kissmet-hostel-api-staging"
# workers_dev remains true, but this account has no workers.dev subdomain yet.
# Serve staging on the approved custom domain until that subdomain is registered.
workers_dev = true
routes = [
  { pattern = "staging-api.kissmetgroup.org/*", zone_name = "kissmetgroup.org" }
]

[env.staging.vars]
APP_NAME = "Kissmet Hostel Portal API"
APP_ENV = "staging"
APP_VERSION = "0.1.0"
PUBLIC_BASE_URL = "https://staging-api.kissmetgroup.org"
ADMIN_ALLOWED_ORIGINS = "https://staging-admin.kissmetgroup.org,https://staging-portal.kissmetgroup.org"
SMS_PROVIDER = "mock"
# SMS_PROVIDER = "arkesel"  # only when staging Arkesel + secrets are intentionally enabled
# ARKESEL_SENDER_ID = "<approved-sender>"
# Never set DEV_OTP_LOG, MIKROTIK_CONNECTOR_URL, or production secrets here.
# STAGING_OTP_TEST_KEY is a Worker secret (wrangler secret put), never a [vars] value.

[[env.staging.d1_databases]]
binding = "DB"
database_name = "kissmet-hostel-staging"
database_id = "958f10b6-a7a6-4943-8c20-afe9b97e6388"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "DOCUMENTS"
# Private bucket — no public access / public bucket URL / custom domain. Worker binding only.
bucket_name = "kissmet-hostel-staging-documents"

# --- production ---
[env.production]
name = "kissmet-hostel-api-production"
workers_dev = false
routes = [
  { pattern = "api.kissmetgroup.org/*", zone_name = "kissmetgroup.org" }
]

[env.production.vars]
APP_NAME = "Kissmet Hostel Portal API"
APP_ENV = "production"
APP_VERSION = "0.1.0"
PUBLIC_BASE_URL = "https://api.kissmetgroup.org"
ADMIN_ALLOWED_ORIGINS = "https://admin.kissmetgroup.org,https://portal.kissmetgroup.org"
# Production OTP SMS (Stage 2F):
SMS_PROVIDER = "arkesel"
ARKESEL_SENDER_ID = "KISSMET"
# Store ARKESEL_API_KEY via: wrangler secret put ARKESEL_API_KEY --env production
# Store MIKROTIK_CONNECTOR_SECRET via: wrangler secret put MIKROTIK_CONNECTOR_SECRET --env production
# MIKROTIK_CONNECTOR_URL = "https://<tunnel-hostname>"  # after Pi Tunnel commissioning
# CONNECTOR_HEARTBEAT_ALLOWED_IDS = "<pi-connector-uuid>"  # after Pi commissioning (migration 0020 applied first)
# Never set SMS_PROVIDER=mock, DEV_OTP_LOG=true, or localhost origins here.

[[env.production.d1_databases]]
binding = "DB"
database_name = "kissmet-production"
database_id = "b8eeb20d-55de-4d8f-af92-62523871b453"
migrations_dir = "migrations"

[[env.production.r2_buckets]]
binding = "DOCUMENTS"
# Private bucket — no public access / public bucket URL. Worker binding only.
bucket_name = "kissmet-documents-production"
